name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # Single Linux runner: this is a pure-Python package, so no macOS/Windows
    # matrix is needed. Two Python versions keep the declared >=3.8 floor honest.
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install -e ".[ops]"
      - name: Run test suite
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
