name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # Single generic Linux runner. This is a pure-Python package, so no
    # macOS/Windows matrix is needed: one command, one job.
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -e ".[ops]"
      - name: Run test suite
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
