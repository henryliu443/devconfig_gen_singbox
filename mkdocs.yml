site_name: DevConfig-Gen
site_description: Provider 驱动的结构化配置生成与校验工具
site_url: https://henryliu443.github.io/DevConfig-Gen/docs/
repo_url: https://github.com/henryliu443/DevConfig-Gen
repo_name: henryliu443/DevConfig-Gen
docs_dir: docs
site_dir: site/docs

theme:
  name: material
  language: zh
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: 切换为深色
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: 切换为浅色

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - 首页: index.md
  - 开始:
      - 安装与快速开始: getting-started.md
  - 命令行:
      - 命令参考: cli.md
      - 配方: cli-cookbook.md
  - 使用:
      - 输入合并与覆盖: input-and-merge.md
      - 格式支持与产物: formats.md
      - 校验与诊断: validation.md
  - 扩展:
      - Provider 参考与开发: providers.md
      - Python API: python-api.md
  - 项目:
      - 开发与测试: development.md
      - 架构总览: architecture.md
