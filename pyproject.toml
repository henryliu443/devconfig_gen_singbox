[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "devconfig_gen_singbox"
version = "2.1.3"
authors = [
  { name = "henryliu443", email = "henryliu443@gmail.com" },
]
description = "Provider-based developer configuration generation engine and CLI"
readme = "README.md"
requires-python = ">=3.8"
license = "Apache-2.0"
keywords = ["configuration", "json", "yaml", "code-generation", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=5.1"]
ops = ["cryptography>=3.4"]
dev = ["build", "wheel", "PyYAML>=5.1", "cryptography>=3.4"]
docs = ["mkdocs-material>=9.5,<10"]

[project.scripts]
# One command, named exactly after the PyPI distribution.
devconfig_gen_singbox = "devconfig_gen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
devconfig_gen = ["py.typed", "providers/singbox/data/*.json"]
singbox_ops = ["templates/*.template"]
